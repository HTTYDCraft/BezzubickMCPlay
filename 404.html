<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="robots" content="noindex,follow" />
<meta name="description" content="Bezzubick MCPlay — страница не найдена." />
<link rel="icon" href="https://httydcraft.github.io/BezzubickMCPlay/assets/avatar.png" type="image/png" />
<link rel="canonical" href="https://httydcraft.github.io/BezzubickMCPlay/404" />
<title>404</title>
<style>
  html,body{height:100%}
  body{
    margin:0;background:#000;color:#fff;
    font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .container{
    display:flex;align-items:center;gap:clamp(28px,5vw,48px);
    animation:rise .7s cubic-bezier(.22,.61,.36,1) both;
    padding:0 24px;
  }
  .avatar{
    width:clamp(80px,18vw,120px);height:clamp(80px,18vw,120px);
    border-radius:50%;object-fit:cover;flex-shrink:0;
    box-shadow:0 0 40px rgba(187,134,252,.25);
    border:2px solid rgba(187,134,252,.35);
  }
  .info{text-align:left}
  .code{
    margin:0;font-size:clamp(48px,10vw,72px);font-weight:700;letter-spacing:-.04em;
    line-height:1;color:#fff;
  }
  .msg{margin:8px 0 0;font-size:clamp(16px,3vw,20px);font-weight:500;opacity:.85}
  .btn{
    display:inline-block;margin-top:20px;padding:10px 28px;border-radius:9999px;
    background:#BB86FC;color:#000;text-decoration:none;font-weight:600;font-size:14px;
    transition:opacity .2s;
  }
  .btn:hover{opacity:.8}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.container{animation:none}}
  @media (max-width:480px){
    .container{flex-direction:column;text-align:center}
    .info{text-align:center}
  }
</style>
</head>
<body>
<main class="container">
  <img class="avatar" src="https://httydcraft.github.io/BezzubickMCPlay/assets/avatar.png" alt="BezzubickMCPlay" />
  <div class="info">
    <p class="code">404</p>
    <p class="msg" id="msg">Страница не найдена</p>
    <a class="btn" id="btn" href="https://httydcraft.github.io/BezzubickMCPlay/">На главную</a>
  </div>
</main>
<script>
(function(){
  var lang = (navigator.language || 'ru').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  document.documentElement.lang = lang;
  if (lang === 'en') {
    document.getElementById('msg').textContent = 'Page not found';
    document.getElementById('btn').textContent = 'Back to main';
    document.title = '404 — Page not found';
  }
})();
</script>
</body>
</html>
