<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="Bezzubick MCPlay — перенаправление." />
<link rel="icon" href="https://httydcraft.github.io/BezzubickMCPlay/assets/avatar.png" type="image/png" />
<link rel="canonical" href="https://httydcraft.github.io/BezzubickMCPlay/" />
<title>Загрузка…</title>
<style>
  html,body{height:100%}
  body{
    margin:0;background:#000;color:#fff;
    font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .loader{text-align:center;animation:rise .7s cubic-bezier(.22,.61,.36,1) both}
  .loader h1{margin:0;font-size:clamp(28px,6vw,40px);font-weight:600;letter-spacing:-.02em}
  .loader h1 .dot{animation:blink 1.2s infinite}
  .loader h1 .dot:nth-child(2){animation-delay:.2s}
  .loader h1 .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .bar{width:min(220px,50vw);height:3px;border-radius:9999px;margin:22px auto 0;background:rgba(255,255,255,.12);overflow:hidden}
  .bar span{display:block;height:100%;width:40%;border-radius:inherit;background:#BB86FC;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
  .manual{margin-top:26px;font-size:14px;color:rgba(255,255,255,.55);text-decoration:none}
  .manual:hover{color:#fff}
  @media (prefers-reduced-motion:reduce){.loader{animation:none}.loader h1 .dot{animation:none;opacity:1}.bar span{animation:none;width:100%}}
</style>
<noscript><meta http-equiv="refresh" content="0;url=https://httydcraft.github.io/BezzubickMCPlay/" /></noscript>
</head>
<body>
<main class="loader">
  <h1><span id="loading-text">Загрузка</span><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></h1>
  <div class="bar" aria-hidden="true"><span></span></div>
  <div><a id="manual-link" class="manual" href="https://httydcraft.github.io/BezzubickMCPlay/">httydcraft.github.io/BezzubickMCPlay</a></div>
</main>
<script>
(function(){
  var TARGET = 'https://httydcraft.github.io/BezzubickMCPlay';
  var lang = (navigator.language || 'ru').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  document.documentElement.lang = lang;
  var label = lang === 'ru' ? 'Загрузка' : 'Loading';
  document.getElementById('loading-text').textContent = label;
  document.title = label + '…';
  // Forward path + all query params (?lang, ?theme, ?dev, …) + hash.
  var path = (location.pathname || '/').replace(/^\/+|\/+$/g, '');
  var url = TARGET + (path ? '/' + path + '/' : '/') + (location.search || '') + (location.hash || '');
  document.getElementById('manual-link').href = url;
  setTimeout(function(){ location.replace(url); }, 800);
})();
</script>
</body>
</html>
