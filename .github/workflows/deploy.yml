name: Deploy Site

# Pure static build on Linux: Python stdlib builder reads Content/*.md +
# Config/*.yml and emits dist/. No Swift, no macOS, no WASM toolchain.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - 'streams_history.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  SITE_BASE: /BezzubickMCPlay

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        run: python3 tools/build.py --base "$SITE_BASE"

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
