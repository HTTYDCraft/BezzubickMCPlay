name: Deploy Site

# Pure static build on Linux: Python stdlib builder reads Content/*.md +
# Config/*.yml and emits dist/. No Swift, no macOS, no WASM toolchain.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - 'streams_history.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  SITE_BASE: /BezzubickMCPlay
  SITE_URL: https://httydcraft.github.io/BezzubickMCPlay

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        run: python3 tools/build.py --base "$SITE_BASE" --site-url "$SITE_URL"

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # IndexNow: instantly notify Bing + Yandex about both pages.
      # (Google doesn't support IndexNow — it reads robots.txt/sitemap.xml.)
      - name: Ping IndexNow
        run: |
          KEY=$(tr -d ' \n\r' < indexnow-key.txt)
          curl -s -o /dev/null -w "IndexNow:%{http_code}\n" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"httydcraft.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"$SITE_URL/$KEY.txt\",\"urlList\":[\"$SITE_URL/\",\"$SITE_URL/links/\"]}" \
            https://api.indexnow.org/indexnow
